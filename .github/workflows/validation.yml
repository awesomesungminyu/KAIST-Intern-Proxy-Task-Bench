name: Validation contract
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run standard-library contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify catalog loads without ML dependencies
        run: python3 -m validation list > /tmp/proxy-validation-catalog.json
